rect x="420" y="120" width="150.0" height="18" rx="4" fill="var(--structure)" /><text x="576.0" y="133" class="xs" text-anchor="start" >14</text><text x="412" y="157" class="s" text-anchor="end" >score 3</text><rect x="420" y="144" width="75.0" height="18" rx="4" fill="var(--structure)" /><text x="501.0" y="157" class="xs" text-anchor="start" >7</text><text x="412" y="181" class="s" text-anchor="end" >score 2</text><rect x="420" y="168" width="32.142857142857146" height="18" rx="4" fill="var(--structure)" /><text x="458.14285714285717" y="181" class="xs" text-anchor="start" >3</text><text x="412" y="205" class="s" text-anchor="end" >score 1</text><rect x="420" y="192" width="32.142857142857146" height="18" rx="4" fill="var(--structure)" /><text x="458.14285714285717" y="205" class="xs" text-anchor="start" >3</text><text x="320" y="230" class="xs" text-anchor="start" >build keeps scores 3 to 5</text><text x="608" y="78" class="t" text-anchor="start" >Block support</text><text x="700" y="109" class="s" text-anchor="end" >supported</text><rect x="708" y="96" width="150.0" height="18" rx="4" fill="var(--sketch)" /><text x="864.0" y="109" class="xs" text-anchor="start" >48</text><text x="700" y="133" class="s" text-anchor="end" >derived</text><rect x="708" y="120" width="115.625" height="18" rx="4" fill="var(--sketch)" /><text x="829.625" y="133" class="xs" text-anchor="start" >37</text><text x="700" y="157" class="s" text-anchor="end" >context</text><rect x="708" y="144" width="53.125" height="18" rx="4" fill="var(--sketch)" /><text x="767.125" y="157" class="xs" text-anchor="start" >17</text><text x="700" y="181" class="s" text-anchor="end" >none_needed</text><rect x="708" y="168" width="50.0" height="18" rx="4" fill="var(--sketch)" /><text x="764.0" y="181" class="xs" text-anchor="start" >16</text><text x="700" y="205" class="s" text-anchor="end" >tool</text><rect x="708" y="192" width="37.5" height="18" rx="4" fill="var(--sketch)" /><text x="751.5" y="205" class="xs"