<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Architecture: diffusion planner, projector, AR verbalizer"><title>Architecture: diffusion planner, projector, AR verbalizer</title>
<style>
  svg { --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --ink3:#8a8984; --line:#d9d8d3; --card:#ffffff;
        --mask:#e4e3de; --intent:#2a78d6; --structure:#eb6834; --sketch:#1baf7a; --text:#52514e;
        --intent-bg:#e8f0fb; --structure-bg:#fdeee7; --sketch-bg:#e5f6ef; --text-bg:#efeeea; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#8f8e86; --line:#3a3a37; --card:#232322;
          --mask:#34342f; --intent:#3987e5; --structure:#d95926; --sketch:#199e70; --text:#c3c2b7;
          --intent-bg:#1c2a3d; --structure-bg:#3a2419; --sketch-bg:#16302a; --text-bg:#2b2b29; }
  }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .h { font-size: 20px; font-weight: 700; }
  .t { font-size: 15px; font-weight: 600; }
  .b { font-size: 13px; }
  .s { font-size: 12px; fill: var(--ink2); }
  .xs { font-size: 11px; fill: var(--ink3); }
  .bg { fill: var(--bg); }
  .card { fill: var(--card); stroke: var(--line); stroke-width: 1; }
  .rule { stroke: var(--line); stroke-width: 1; fill: none; }
  .arrow { stroke: var(--ink3); stroke-width: 2; fill: none; marker-end: url(#ah); }
  .ah { fill: var(--ink3); }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="960" height="420" rx="12"/><text x="32" y="44" class="h" text-anchor="start" >Where the dataset is used</text><text x="32" y="68" class="s" text-anchor="start" >A small diffusion model plans; a large autoregressive model writes. This repo builds the training data for both sides.</text><rect x="32" y="170" width="120" height="70" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5" /><text x="92" y="200" class="t" text-anchor="middle" >Prompt</text><text x="92" y="220" class="xs" text-anchor="middle" >user question</text><line x1="154" y1="205" x2="194" y2="205" class="arrow"/><rect x="196" y="110" width="250" height="190" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5" /><text x="321" y="138" class="t" text-anchor="middle" >Diffusion planner</text><text x="321" y="156" class="xs" text-anchor="middle" >small (&lt; 14B), masked discrete diffusion</text><rect x="216" y="172" width="210" height="28" rx="6" fill="var(--intent-bg)" /><rect x="216" y="172" width="5" height="28" rx="2" fill="var(--intent)" /><text x="232" y="191" class="b" text-anchor="start" >intent rung</text><rect x="216" y="208" width="210" height="28" rx="6" fill="var(--structure-bg)" /><rect x="216" y="208" width="5" height="28" rx="2" fill="var(--structure)" /><text x="232" y="227" class="b" text-anchor="start" >structure rung</text><rect x="216" y="244" width="210" height="28" rx="6" fill="var(--sketch-bg)" /><rect x="216" y="244" width="5" height="28" rx="2" fill="var(--sketch)" /><text x="232" y="263" class="b" text-anchor="start" >sketch blocks B1..B16</text><path d="M 446 260 C 500 260, 500 330, 400 330 L 330 330 C 290 330, 290 305, 300 302" class="arrow" stroke-dasharray="5 4"/><text x="480" y="352" class="s" text-anchor="middle" >critic: re-mask a wrong block and redo it</text><line x1="448" y1="205" x2="500" y2="205" class="arrow"/><rect x="502" y="160" width="130" height="90" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5" /><text x="567" y="196" class="t" text-anchor="middle" >Projector</text><text x="567" y="216" class="xs" text-anchor="middle" >2-layer MLP</text><text x="567" y="232" class="xs" text-anchor="middle" >block → AR space</text><line x1="634" y1="205" x2="674" y2="205" class="arrow"/><rect x="676" y="130" width="170" height="150" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5" /><text x="761" y="160" class="t" text-anchor="middle" >AR verbalizer</text><text x="761" y="178" class="xs" text-anchor="middle" >large model, multi-token</text><text x="761" y="194" class="xs" text-anchor="middle" >prediction heads</text><text x="761" y="224" class="s" text-anchor="middle" >ranks the plan&#x27;s claims</text><text x="761" y="242" class="s" text-anchor="middle" >by support + confidence,</text><text x="761" y="260" class="s" text-anchor="middle" >then writes the answer</text><line x1="848" y1="205" x2="888" y2="205" class="arrow"/><text x="912" y="200" class="t" text-anchor="middle" >Final</text><text x="912" y="218" class="t" text-anchor="middle" >text</text><rect x="676" y="330" width="170" height="52" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5" /><text x="761" y="352" class="t" text-anchor="middle" >Retrieval</text><text x="761" y="370" class="xs" text-anchor="middle" >fills RETRIEVE slots</text><line x1="761" y1="328" x2="761" y2="284" class="arrow"/><rect x="196" y="84" width="436" height="18" rx="4" fill="none" /><text x="321" y="96" class="xs" text-anchor="middle" >learns from: labels.intent / structure / sketch</text><text x="567" y="148" class="xs" text-anchor="middle" >learns from: alignment</text><text x="761" y="118" class="xs" text-anchor="middle" >learns from: target</text></svg>