<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="300" viewBox="0 0 1150 300" role="img" aria-label="Dataset build pipeline"><title>Dataset build pipeline</title>
<style>
  svg { --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --ink3:#8a8984; --line:#d9d8d3; --card:#ffffff;
        --mask:#e4e3de; --intent:#2a78d6; --structure:#eb6834; --sketch:#1baf7a; --text:#52514e;
        --intent-bg:#e8f0fb; --structure-bg:#fdeee7; --sketch-bg:#e5f6ef; --text-bg:#efeeea; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#8f8e86; --line:#3a3a37; --card:#232322;
          --mask:#34342f; --intent:#3987e5; --structure:#d95926; --sketch:#199e70; --text:#c3c2b7;
          --intent-bg:#1c2a3d; --structure-bg:#3a2419; --sketch-bg:#16302a; --text-bg:#2b2b29; }
  }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .h { font-size: 20px; font-weight: 700; }
  .t { font-size: 15px; font-weight: 600; }
  .b { font-size: 13px; }
  .s { font-size: 12px; fill: var(--ink2); }
  .xs { font-size: 11px; fill: var(--ink3); }
  .bg { fill: var(--bg); }
  .card { fill: var(--card); stroke: var(--line); stroke-width: 1; }
  .rule { stroke: var(--line); stroke-width: 1; fill: none; }
  .arrow { stroke: var(--ink3); stroke-width: 2; fill: none; marker-end: url(#ah); }
  .ah { fill: var(--ink3); }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="1150" height="300" rx="12"/><text x="32" y="44" class="h" text-anchor="start" >How the dataset is built</text><text x="32" y="68" class="s mono" text-anchor="start" >python -m loa.cli fetch → label → build</text><rect x="32" y="100" width="160" height="110" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5" /><text x="112.0" y="128" class="t" text-anchor="middle" >Sources</text><text x="112.0" y="154" class="s" text-anchor="middle" >9 public HF datasets</text><text x="112.0" y="172" class="s" text-anchor="middle" >chat, math, science,</text><text x="112.0" y="190" class="s" text-anchor="middle" >agentic, critic</text><line x1="194" y1="155" x2="220" y2="155" class="arrow"/><rect x="222" y="100" width="160" height="110" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5" /><text x="302.0" y="128" class="t" text-anchor="middle" >fetch</text><text x="302.0" y="154" class="s" text-anchor="middle" >sample rows,</text><text x="302.0" y="172" class="s" text-anchor="middle" >normalize to</text><text x="302.0" y="190" class="s" text-anchor="middle" >context + target</text><line x1="384" y1="155" x2="410" y2="155" class="arrow"/><rect x="412" y="100" width="160" height="110" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5" /><text x="492.0" y="128" class="t" text-anchor="middle" >label</text><text x="492.0" y="154" class="s" text-anchor="middle" >teacher model writes</text><text x="492.0" y="172" class="s" text-anchor="middle" >intent, structure,</text><text x="492.0" y="190" class="s" text-anchor="middle" >sketch, quality</text><line x1="574" y1="155" x2="600" y2="155" class="arrow"/><rect x="602" y="100" width="160" height="110" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5" /><text x="682.0" y="128" class="t" text-anchor="middle" >validate</text><text x="682.0" y="154" class="s" text-anchor="middle" >anchors → spans</text><text x="682.0" y="172" class="s" text-anchor="middle" >reject bad labels</text><text x="682.0" y="190" class="s" text-anchor="middle" >(.rejects file)</text><line x1="764" y1="155" x2="790" y2="155" class="arrow"/><rect x="792" y="100" width="160" height="110" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5" /><text x="872.0" y="128" class="t" text-anchor="middle" >build</text><text x="872.0" y="154" class="s" text-anchor="middle" >dedup, quality ≥ 3,</text><text x="872.0" y="172" class="s" text-anchor="middle" >canvas + spans,</text><text x="872.0" y="190" class="s" text-anchor="middle" >split by id hash</text><line x1="954" y1="155" x2="984" y2="155" class="arrow"/><rect x="988" y="86" width="140" height="28" rx="6" fill="var(--text-bg)" /><text x="998" y="105" class="b" text-anchor="start" >train</text><text x="1120" y="105" class="xs" text-anchor="end" >96%</text><rect x="988" y="122" width="140" height="28" rx="6" fill="var(--text-bg)" /><text x="998" y="141" class="b" text-anchor="start" >validation</text><text x="1120" y="141" class="xs" text-anchor="end" >2%</text><rect x="988" y="158" width="140" height="28" rx="6" fill="var(--text-bg)" /><text x="998" y="177" class="b" text-anchor="start" >test</text><text x="1120" y="177" class="xs" text-anchor="end" >2%</text><rect x="988" y="194" width="140" height="28" rx="6" fill="var(--text-bg)" /><text x="998" y="213" class="b" text-anchor="start" >seed</text><text x="1120" y="213" class="xs" text-anchor="end" >gold rows</text><text x="32" y="256" class="s" text-anchor="start" >Gold seed set: 37 rows labeled by a frontier model and passed through the same checks, kept as its own split for audits and benchmarks.</text></svg>