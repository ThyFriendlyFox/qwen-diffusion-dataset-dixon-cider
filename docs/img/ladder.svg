<svg xmlns="http://www.w3.org/2000/svg" width="880" height="698" viewBox="0 0 880 698" role="img" aria-label="Ladder of abstraction for one math answer"><title>Ladder of abstraction for one math answer</title>
<style>
  svg { --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --ink3:#8a8984; --line:#d9d8d3; --card:#ffffff;
        --mask:#e4e3de; --intent:#2a78d6; --structure:#eb6834; --sketch:#1baf7a; --text:#52514e;
        --intent-bg:#e8f0fb; --structure-bg:#fdeee7; --sketch-bg:#e5f6ef; --text-bg:#efeeea; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#8f8e86; --line:#3a3a37; --card:#232322;
          --mask:#34342f; --intent:#3987e5; --structure:#d95926; --sketch:#199e70; --text:#c3c2b7;
          --intent-bg:#1c2a3d; --structure-bg:#3a2419; --sketch-bg:#16302a; --text-bg:#2b2b29; }
  }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .h { font-size: 20px; font-weight: 700; }
  .t { font-size: 15px; font-weight: 600; }
  .b { font-size: 13px; }
  .s { font-size: 12px; fill: var(--ink2); }
  .xs { font-size: 11px; fill: var(--ink3); }
  .bg { fill: var(--bg); }
  .card { fill: var(--card); stroke: var(--line); stroke-width: 1; }
  .rule { stroke: var(--line); stroke-width: 1; fill: none; }
  .arrow { stroke: var(--ink3); stroke-width: 2; fill: none; marker-end: url(#ah); }
  .ah { fill: var(--ink3); }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="698" rx="12"/><text x="32" y="44" class="h" text-anchor="start" >Planning an answer, one rung at a time</text><text x="32" y="68" class="s" text-anchor="start" >Question: Tamika drove for 8 hours at an average speed of 45 miles per hour. Logan drove for 5 hours at 55...</text><rect x="32" y="92" width="816" height="118" rx="10" fill="var(--intent-bg)" /><rect x="32" y="92" width="6" height="118" rx="3" fill="var(--intent)" /><text x="54" y="118" class="t" text-anchor="start" xml:space="preserve">1  Intent</text><text x="190" y="118" class="s" text-anchor="start" >What am I trying to say, and to whom?</text><text x="54" y="140" class="b" text-anchor="start" >ideas: distance = speed x time for each driver; Tamika 360 mi, Logan 275 mi; difference is 85 miles</text><text x="54" y="158" class="b" text-anchor="start" >tone: neutral and precise</text><text x="54" y="176" class="b" text-anchor="start" >goal: solve, show work, state the final answer</text><text x="54" y="194" class="b" text-anchor="start" >reader: grade-school math student</text><line x1="440.0" y1="212" x2="440.0" y2="230" class="arrow"/><rect x="32" y="234" width="816" height="118" rx="10" fill="var(--structure-bg)" /><rect x="32" y="234" width="6" height="118" rx="3" fill="var(--structure)" /><text x="54" y="260" class="t" text-anchor="start" xml:space="preserve">2  Structure</text><text x="190" y="260" class="s" text-anchor="start" >What shape will the answer take?</text><text x="54" y="282" class="b" text-anchor="start" >form: terse plain-text arithmetic lines, then bold final answer, about 30 words</text><text x="54" y="300" class="b" text-anchor="start" >S1 compute each distance (glue: none (opening))</text><text x="54" y="318" class="b" text-anchor="start" >S2 take difference (glue: consequence)</text><text x="54" y="336" class="b" text-anchor="start" >S3 final answer (glue: answer line)</text><line x1="440.0" y1="354" x2="440.0" y2="372" class="arrow"/><rect x="32" y="376" width="816" height="118" rx="10" fill="var(--sketch-bg)" /><rect x="32" y="376" width="6" height="118" rx="3" fill="var(--sketch)" /><text x="54" y="402" class="t" text-anchor="start" xml:space="preserve">3  Sketch</text><text x="190" y="402" class="s" text-anchor="start" >Rough notes for each part, like a first scribble</text><text x="54" y="424" class="b mono" text-anchor="start" >B1 &quot;Tamika&#x27;s distance = hrs x mph&quot; | computation, derived, 0.99</text><text x="54" y="442" class="b mono" text-anchor="start" >B2 &quot;same for Logan&quot; | computation, derived, 0.99</text><text x="54" y="460" class="b mono" text-anchor="start" >B3 &quot;subtract the two, say she went farther&quot; | computation, derived, 0.99</text><text x="54" y="478" class="b mono" text-anchor="start" >B4 &quot;85&quot; | answer, derived, 0.99</text><line x1="440.0" y1="496" x2="440.0" y2="514" class="arrow"/><rect x="32" y="518" width="816" height="136" rx="10" fill="var(--text-bg)" /><rect x="32" y="518" width="6" height="136" rx="3" fill="var(--text)" /><text x="54" y="544" class="t" text-anchor="start" xml:space="preserve">4  Final text</text><text x="190" y="544" class="s" text-anchor="start" >Written out neatly by the big model</text><text x="54" y="566" class="b mono" text-anchor="start" >Tamika drove 8 hours * 45 mph = 360 miles</text><text x="54" y="584" class="b mono" text-anchor="start" >Logan drove 5 hours * 55 mph = 275 miles</text><text x="54" y="602" class="b mono" text-anchor="start" >360 - 275 = 85 miles</text><text x="54" y="620" class="b mono" text-anchor="start" >Tamika drove 85 miles farther.</text><text x="54" y="638" class="b mono" text-anchor="start" >Answer: 85</text><text x="32" y="680" class="s" text-anchor="start" >Each rung gets more concrete. Only the last one has finished sentences.</text></svg>